name: LLMs.txt Spec Check

on:
  schedule:
    # 每日 05:00 UTC（北京时间 13:00）
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "只检查指定项目 (projects.config.json 里的 id，留空则全量)"
        required: false
        default: ""
      dry_run:
        description: "Dry run（仅扫描与打印 issue 正文，不提 issue；汇总报告仍会生成并 commit）"
        required: false
        type: boolean
        default: false
      force_check:
        description: "强制执行（提 issue 模式不再被「已有未关闭 issue 即跳过扫描」的查重拦截；复检仍有问题→就地更新原 issue 内容，问题已消除→在原 issue 评论 /close 关闭）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: llms-txt-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run llms.txt spec check
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          ARGS="--submit-issues"
          if [ -n "${{ inputs.site }}" ]; then
            ARGS="$ARGS --site=${{ inputs.site }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force_check }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          node scripts/checks/check-llms-txt.mjs $ARGS

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduled-reports/llms
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "chore(llms-txt): daily spec check reports"
            git pull --rebase
            git push
          fi
