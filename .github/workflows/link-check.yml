name: Link Check

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      community:
        description: '只检查指定社区 (link-checker-config.yaml 里的 name, 留空则全部)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (仅扫描，不提 issue)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  link-check:
    name: Scan for broken links
    runs-on: portal-x86
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Check links
        shell: bash
        env:
          COMMUNITY: ${{ inputs.community || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          ARGS="--all-communities"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dryRun"
          fi
          if [ -n "$COMMUNITY" ]; then
            ARGS="--community=$COMMUNITY"
          fi

          node packages/link-checker/src/check-links.js $ARGS

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-results
          path: "link-checker-results/*.json"
          retention-days: 30
