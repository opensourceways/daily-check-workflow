name: Sitemap Spec Check

on:
  schedule:
    # 每天 04:30 UTC（北京时间 12:30），错开 TDK 重复检查（周一 03:30）
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "只检查指定项目 (projects.config.json 里的 id，留空则按默认跳过规则全量)"
        required: false
        default: ""
      dry_run:
        description: "Dry run（仅扫描与打印 issue 正文，不写 brief/full、不提 issue）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sitemap-spec-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sitemap spec check
        working-directory: workflow
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          ARGS="--submit-issues"
          if [ -n "${{ inputs.site }}" ]; then
            ARGS="$ARGS --site=${{ inputs.site }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/sitemap-spec-check.mjs $ARGS

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduled-reports/sitemap
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "chore(sitemap-spec): daily sitemap spec check reports"
            git pull --rebase
            git push
          fi
