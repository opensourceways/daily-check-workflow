name: TDK Duplicate Check

on:
  schedule:
    # 每周一 03:30 UTC（北京时间 11:30）
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      site:
        description: "只检查指定项目 (projects.config.json 里的 id，留空则按默认跳过规则全量)"
        required: false
        default: ""
      dry_run:
        description: "Dry run（仅扫描与打印 issue 正文，不写报告文件、不提 issue）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tdk-duplicate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run TDK duplicate check
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          ARGS="--submit-issues"
          if [ -n "${{ inputs.site }}" ]; then
            ARGS="$ARGS --site=${{ inputs.site }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/checks/check-tdk-duplicate.mjs $ARGS

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduled-reports/tdk
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "chore(tdk-dup): weekly duplicate check reports"
            git pull --rebase
            git push
          fi
