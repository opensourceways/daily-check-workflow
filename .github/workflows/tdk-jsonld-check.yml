name: TDK & JSON-LD Full Check

# 2026-10：原 json-ld-check.yml（每日采样）与 tdk-duplicate-check.yml 合并——
# 两维度共用同一份 sitemap 全量页面抓取（scripts/checks/check-tdk-jsonld.mjs），
# issue 前缀（[GEO TDK Duplicate] / [GEO JSON-LD]）、查重、双报告、报告目录均保持各维度独立。
on:
  schedule:
    # 每周一 03:30 UTC（北京时间 11:30）
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      site:
        description: "只检查指定项目 (projects.config.json 里的 id，留空则按默认跳过规则全量)"
        required: false
        default: ""
      dims:
        description: "检查维度（tdk=仅 TDK 重复，jsonld=仅 JSON-LD 规范，both=两维度共用抓取同时跑）"
        required: false
        type: choice
        options:
          - both
          - tdk
          - jsonld
        default: both
      dry_run:
        description: "Dry run（仅扫描与打印 issue 正文，不写报告文件、不提 issue）"
        required: false
        type: boolean
        default: false
      force_check:
        description: "强制执行（提 issue 模式不再被「已有未关闭 issue 即跳过扫描」的查重拦截；复检仍有问题→就地更新原 issue 内容，问题已消除→在原 issue 评论 /close 关闭。两维度各自判定）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tdk-jsonld-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run TDK & JSON-LD full check
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          ARGS="--submit-issues"
          case "${{ inputs.dims }}" in
            ""|both) ARGS="$ARGS --dims=tdk,jsonld" ;;
            tdk) ARGS="$ARGS --dims=tdk" ;;
            jsonld) ARGS="$ARGS --dims=jsonld" ;;
          esac
          if [ -n "${{ inputs.site }}" ]; then
            ARGS="$ARGS --site=${{ inputs.site }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force_check }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          node scripts/checks/check-tdk-jsonld.mjs $ARGS

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduled-reports/tdk scheduled-reports/jsonld
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "chore(tdk-jsonld): weekly full-site check reports"
            git pull --rebase
            git push
          fi
