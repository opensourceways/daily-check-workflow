name: Robots.txt Spec Check

on:
  schedule:
    # 每日 04:00 UTC（北京时间 12:00）
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "只检查指定项目 (projects.config.json 里的 id，留空则全量)"
        required: false
        default: ""
      dry_run:
        description: "Dry run（仅扫描与打印 issue 正文，不提 issue；汇总报告仍会生成并 commit）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: robots-txt-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run robots.txt spec check
        working-directory: workflow
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          ARGS="--submit-issues"
          if [ -n "${{ inputs.site }}" ]; then
            ARGS="$ARGS --site=${{ inputs.site }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/check-robots.mjs $ARGS

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual-review/issues/robotstxt
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "chore(robots-txt): daily spec check report"
            git pull --rebase
            git push
          fi
